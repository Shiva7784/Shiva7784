name: Update Achievements

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual trigger
  push:
    branches:
      - main

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit back to the repo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update achievements in README
        run: node update_achievements.js

      - name: Generate light-theme streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=Shiva7784&theme=default&hide_border=false
          path: streak-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate dark-theme streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=Shiva7784&theme=dark&hide_border=false
          path: streak-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md streak-light.svg streak-dark.svg
          git diff-index --quiet HEAD || git commit -m "auto: update achievements and streak stats"
          git push
